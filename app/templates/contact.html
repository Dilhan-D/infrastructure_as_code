{% extends "base.html" %}
{% block title %}Contact — Boursoum{% endblock %}
{% block content %}
<section class="page-header">
    <h1>Contactez-nous</h1>
    <p>Une question, une suggestion ? Écrivez-nous.</p>
</section>

<section class="contact-form-wrapper">
    <form class="contact-form" action="#" method="post">
        <label for="name">Nom</label>
        <input type="text" id="name" name="name" placeholder="Votre nom">

        <label for="email">Email</label>
        <input type="email" id="email" name="email" placeholder="vous@exemple.com">

        <label for="message">Message</label>
        <textarea id="message" name="message" rows="5" placeholder="Votre message..."></textarea>

        <button type="submit" class="btn btn-primary">Envoyer</button>
    </form>
</section>
{% endblock %}
